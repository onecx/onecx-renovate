name: Renovate
on:
  workflow_dispatch:
  # schedule:
  #   - cron: '0/15 * * * *'
jobs:
  renovate:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v6.0.3
      - name: Renovate
        uses: renovatebot/github-action@v46.1.15
        with:
          configurationFile: config/renovate/config.js
          token: ${{ secrets.RENOVATE_TOKEN }}